<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<title>Tutorijal 1, Zadatak 5</title>
<style>
	body { background: #ffff55; }
	table { width: 100%; border: 2px solid #444; }
	th, td { border: 2px solid #444; padding: 12px; text-align: center; }
	th { background: gray; }
	.predmet { text-align: left; }
</style>
</head>
<body>
<table>
	<caption>Bodovanje po predmetima</caption>
	<tr>
		<th style="width: 24%"></th>
		<th style="width: 19%">Ispiti</th>
		<th style="width: 26%">Zadaće</th>
		<th style="width: 31%">Prisustvo</th>
	</tr>
	<tr>
		<td class="predmet">PNWT</td>
		<td>20</td>
		<td>10</td>
		<td>10</td>
	</tr>
	<tr>
		<td class="predmet">MMS</td>
		<td>20</td>
		<td colspan="2">30</td>
	</tr>
	<tr>
		<td class="predmet" rowspan="2">SI</td>
		<td>20/2</td>
		<td>10</td>
		<td>10</td>
	</tr>
	<tr>
		<td>20</td>
		<td colspan="2">?</td>
	</tr>
</table>
</body>
</html>
